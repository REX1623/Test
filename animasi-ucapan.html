<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Matrix Particle Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container HP Vertical Portrait Ratio */
        .phone-frame {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 880px;
            background-color: #050505;
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.2);
            overflow: hidden;
            border-radius: 0px;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 640px) {
            .phone-frame {
                border-radius: 28px;
                border: 2px solid rgba(255, 105, 180, 0.3);
                height: 92vh;
            }
        }

        /* Canvas Overlay */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Controls & Customization Modal Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Pink Neon Glow Effects */
        .glow-text {
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4, 0 0 30px #ff1493;
        }

        /* Modal Custom CSS */
        .modal-bg {
            background: rgba(10, 10, 10, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: #ff69b4;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Phone Canvas Container -->
    <div class="phone-frame">
        <!-- Matrix & Particle Combined Canvas -->
        <canvas id="mainCanvas"></canvas>

        <!-- UI Interactive Layer -->
        <div class="ui-layer">
            <!-- Top Audio Control -->
            <div class="flex justify-between items-center w-full">
                <button id="soundBtn" class="interactive p-3 rounded-full bg-black/50 text-pink-400 border border-pink-500/30 hover:bg-pink-500/20 active:scale-95 transition-all shadow-lg flex items-center gap-2">
                    <svg id="speakerIcon" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                    <span id="soundStatus" class="text-xs font-bold uppercase tracking-wider">Musik On</span>
                </button>

                <button id="configBtn" class="interactive p-3 rounded-full bg-black/50 text-pink-400 border border-pink-500/30 hover:bg-pink-500/20 active:scale-95 transition-all shadow-lg">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                    </svg>
                </button>
            </div>

            <!-- Start Screen Overlay -->
            <div id="startOverlay" class="interactive absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-6 text-center z-20 backdrop-blur-sm transition-opacity duration-500">
                <div class="w-20 h-20 mb-6 rounded-full bg-pink-500/20 border-2 border-pink-500 flex items-center justify-center animate-pulse shadow-lg shadow-pink-500/30">
                    <svg class="w-10 h-10 text-pink-400 ml-1" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-black text-pink-400 mb-2 tracking-widest uppercase glow-text">Birthday Surprise</h1>
                <p class="text-xs text-gray-400 mb-8 max-w-xs leading-relaxed">Sentuh tombol untuk memulai tayangan animasi ucapan dengan alunan lagu ulang tahun.</p>
                <button id="startBtn" class="px-8 py-3.5 rounded-full bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold text-sm tracking-wider shadow-lg shadow-pink-500/40 hover:scale-105 active:scale-95 transition-all border border-pink-300/30">
                    MULAI ANIMASI
                </button>
            </div>

            <!-- Bottom Control Panel -->
            <div class="flex justify-center items-center gap-3 w-full mb-2">
                <button id="replayBtn" class="interactive opacity-0 pointer-events-none transition-all duration-300 px-5 py-2.5 rounded-full bg-black/70 border border-pink-500/40 text-pink-300 text-xs font-bold tracking-widest uppercase hover:bg-pink-500/20 active:scale-95 shadow-lg backdrop-blur-md flex items-center gap-2">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                    </svg>
                    Ulang
                </button>
                <button id="editBtnBottom" class="interactive opacity-0 pointer-events-none transition-all duration-300 px-5 py-2.5 rounded-full bg-black/70 border border-pink-500/40 text-pink-300 text-xs font-bold tracking-widest uppercase hover:bg-pink-500/20 active:scale-95 shadow-lg backdrop-blur-md flex items-center gap-2">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                    </svg>
                    Ubah Teks
                </button>
            </div>
        </div>

        <!-- Custom Settings Modal -->
        <div id="settingsModal" class="interactive fixed inset-0 z-30 modal-bg hidden flex items-center justify-center p-4">
            <div class="bg-zinc-900 border border-pink-500/40 w-full max-w-xs rounded-2xl p-6 shadow-2xl text-left relative">
                <h2 class="text-lg font-bold text-pink-400 mb-4 flex items-center gap-2 border-b border-zinc-800 pb-2">
                    <span>⚙️</span> Edit Pesan Ucapan
                </h2>
                
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block text-gray-400 mb-1 font-semibold">Inisial / Nama (Slide 5)</label>
                        <input type="text" id="inputName" value="HN" maxlength="12" class="w-full bg-black border border-zinc-700 rounded-lg px-3 py-2 text-pink-300 focus:outline-none focus:border-pink-500 uppercase tracking-wider">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1 font-semibold">Teks Usia / Pilihan (Slide 6)</label>
                        <input type="text" id="inputAge" value="HAPPY 10+" maxlength="15" class="w-full bg-black border border-zinc-700 rounded-lg px-3 py-2 text-pink-300 focus:outline-none focus:border-pink-500 uppercase tracking-wider">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1 font-semibold">Tanggal Spesial (Slide 7)</label>
                        <input type="text" id="inputDate" value="01-01-2000" maxlength="12" class="w-full bg-black border border-zinc-700 rounded-lg px-3 py-2 text-pink-300 focus:outline-none focus:border-pink-500 tracking-wider">
                    </div>
                </div>

                <div class="flex gap-2 mt-6">
                    <button id="saveSettingsBtn" class="flex-1 py-2.5 rounded-xl bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs uppercase tracking-wider transition-all shadow-md shadow-pink-600/30">Simpan & Putar</button>
                    <button id="closeSettingsBtn" class="px-4 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-gray-300 font-bold text-xs transition-all">Batal</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Frame Canvas Setup
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const phoneFrame = document.querySelector('.phone-frame');

        let width, height;

        function resizeCanvas() {
            width = canvas.width = phoneFrame.clientWidth;
            height = canvas.height = phoneFrame.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Sequence Messages State
        let customData = {
            name: "HN",
            age: "HAPPY 10+",
            date: "01-01-2000"
        };

        let messages = [];
        function updateMessagesSequence() {
            messages = ["3", "2", "1", "HAPPY BIRTHDAY", customData.name, customData.age, customData.date, " ꦆ ꦭꦎꦮ꦳ꦌ ꦪꦎꦲꦈ "];
        }
        updateMessagesSequence();

        let currentSequenceIndex = 0;
        let animationStage = 'IDLE';

        // Matrix Background Rain Data (Dim Green Char Color like Original Video)
        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*';
        const fontSize = 13;
        let columns = 0;
        let drops = [];

        function initMatrix() {
            columns = Math.floor(width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.floor(Math.random() * -50);
            }
        }
        initMatrix();

        // Particle Engine for Glowing Pink Text Reveal
        let particles = [];
        const particleGap = 3;

        class Particle {
            constructor(targetX, targetY) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.targetX = targetX;
                this.targetY = targetY;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.radius = Math.random() * 1.5 + 1;
                this.color = '#ff69b4';
                this.alpha = Math.random() * 0.5 + 0.5;
            }

            update(dissolve = false) {
                if (dissolve) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.alpha -= 0.025;
                } else {
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    this.x += dx * 0.12;
                    this.y += dy * 0.12;
                }
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowColor = '#ff1493';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function generateParticlesFromText(text) {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = width;
            tempCanvas.height = height;

            let dynamicFontSize = Math.min(width / (text.length * 0.75), 65);
            if (text.length <= 2) dynamicFontSize = 100;

            tempCtx.font = `900 ${dynamicFontSize}px 'Montserrat', sans-serif`;
            tempCtx.fillStyle = '#white';
            tempCtx.textAlign = 'center';
            tempCtx.textBaseline = 'middle';

            const words = text.split(' ');
            if (words.length > 1 && text.length > 10) {
                const line1 = words[0];
                const line2 = words.slice(1).join(' ');
                tempCtx.fillText(line1, width / 2, height / 2 - dynamicFontSize * 0.6);
                tempCtx.fillText(line2, width / 2, height / 2 + dynamicFontSize * 0.6);
            } else {
                tempCtx.fillText(text, width / 2, height / 2);
            }

            const imgData = tempCtx.getImageData(0, 0, width, height).data;
            const newParticles = [];

            for (let y = 0; y < height; y += particleGap) {
                for (let x = 0; x < width; x += particleGap) {
                    const index = (y * width + x) * 4;
                    if (imgData[index + 3] > 128) {
                        newParticles.push(new Particle(x, y));
                    }
                }
            }
            return newParticles;
        }

        // Audio Synthesizer: Continuous Happy Birthday Melody ONLY (NO SFX/glitch/pop)
        class BirthdayAudioSynth {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.isPlaying = false;
                this.melodyTimeout = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playMelody() {
                if (this.isMuted || !this.ctx || this.isPlaying) return;
                this.isPlaying = true;

                const notes = [
                    { f: 261.63, d: 0.35 }, { f: 261.63, d: 0.25 }, { f: 293.66, d: 0.6 }, { f: 261.63, d: 0.6 }, { f: 349.23, d: 0.6 }, { f: 329.63, d: 1.2 },
                    { f: 261.63, d: 0.35 }, { f: 261.63, d: 0.25 }, { f: 293.66, d: 0.6 }, { f: 261.63, d: 0.6 }, { f: 392.00, d: 0.6 }, { f: 349.23, d: 1.2 },
                    { f: 261.63, d: 0.35 }, { f: 261.63, d: 0.25 }, { f: 523.25, d: 0.6 }, { f: 440.00, d: 0.6 }, { f: 349.23, d: 0.6 }, { f: 329.63, d: 0.6 }, { f: 293.66, d: 1.2 },
                    { f: 466.16, d: 0.35 }, { f: 466.16, d: 0.25 }, { f: 440.00, d: 0.6 }, { f: 349.23, d: 0.6 }, { f: 392.00, d: 0.6 }, { f: 349.23, d: 1.5 }
                ];

                let noteIndex = 0;
                const playNext = () => {
                    if (!this.isPlaying || this.isMuted) return;
                    const note = notes[noteIndex];
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(note.f, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + note.d);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + note.d);

                    noteIndex = (noteIndex + 1) % notes.length;
                    this.melodyTimeout = setTimeout(playNext, note.d * 900);
                };

                playNext();
            }

            stopMelody() {
                this.isPlaying = false;
                if (this.melodyTimeout) clearTimeout(this.melodyTimeout);
            }
        }

        const audio = new BirthdayAudioSynth();
        let isDissolving = false;
        let stageTimer = null;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            ctx.font = `${fontSize}px 'Space Mono', monospace`;

            for (let i = 0; i < drops.length; i++) {
                const char = characters.charAt(Math.floor(Math.random() * characters.length));
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                ctx.fillStyle = '#1a3d1a'; // Matrix Green Dim Color
                ctx.fillText(char, x, y);

                if (y > height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        function showBottomControls(show) {
            const replayBtn = document.getElementById('replayBtn');
            const editBtnBottom = document.getElementById('editBtnBottom');
            if (show) {
                replayBtn.classList.remove('opacity-0', 'pointer-events-none');
                editBtnBottom.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                replayBtn.classList.add('opacity-0', 'pointer-events-none');
                editBtnBottom.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function nextSequence() {
            if (currentSequenceIndex >= messages.length) {
                animationStage = 'FINISHED';
                showBottomControls(true);
                return;
            }

            const currentText = messages[currentSequenceIndex];
            particles = generateParticlesFromText(currentText);
            isDissolving = false;

            const displayTime = (currentText.length <= 2) ? 1400 : 2200;

            stageTimer = setTimeout(() => {
                isDissolving = true;
                setTimeout(() => {
                    currentSequenceIndex++;
                    nextSequence();
                }, 550);
            }, displayTime);
        }

        function startAnimationSequence() {
            if (stageTimer) clearTimeout(stageTimer);
            currentSequenceIndex = 0;
            animationStage = 'RUNNING';
            showBottomControls(true);
            audio.playMelody();
            nextSequence();
        }

        function animate() {
            drawMatrix();

            for (let i = 0; i < particles.length; i++) {
                particles[i].update(isDissolving);
                particles[i].draw();
            }

            requestAnimationFrame(animate);
        }

        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');
        const soundBtn = document.getElementById('soundBtn');
        const soundStatus = document.getElementById('soundStatus');
        const replayBtn = document.getElementById('replayBtn');
        const editBtnBottom = document.getElementById('editBtnBottom');
        const configBtn = document.getElementById('configBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');

        const inputName = document.getElementById('inputName');
        const inputAge = document.getElementById('inputAge');
        const inputDate = document.getElementById('inputDate');

        startBtn.addEventListener('click', () => {
            audio.init();
            audio.isMuted = false;
            soundStatus.textContent = 'Musik On';
            startOverlay.classList.add('opacity-0', 'pointer-events-none');
            startAnimationSequence();
        });

        soundBtn.addEventListener('click', () => {
            audio.init();
            audio.isMuted = !audio.isMuted;
            soundStatus.textContent = audio.isMuted ? 'Musik Off' : 'Musik On';
            if (!audio.isMuted) {
                audio.playMelody();
            } else {
                audio.stopMelody();
            }
        });

        replayBtn.addEventListener('click', () => {
            startAnimationSequence();
        });

        editBtnBottom.addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
        });

        configBtn.addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
        });

        saveSettingsBtn.addEventListener('click', () => {
            customData.name = inputName.value.trim().toUpperCase() || "HN";
            customData.age = inputAge.value.trim().toUpperCase() || "HAPPY 10+";
            customData.date = inputDate.value.trim() || "01-01-2000";

            updateMessagesSequence();
            settingsModal.classList.add('hidden');
            startOverlay.classList.add('opacity-0', 'pointer-events-none');
            startAnimationSequence();
        });

        window.onload = () => {
            animate();
        };
    </script>
</body>
</html>
